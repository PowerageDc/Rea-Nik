        // nikFormatMinSec / nikMatchMarkerCategory viven ahora en

        // Command IDs, NIK_SLOW_POLL/NIK_ONDEMAND_READS y flags de estado runtime
        // para ReaPitch/Playrate/ProjectTabs viven ahora en config.js

        // nikParseProjectTabs vive ahora en modals/project-tabs/project-tabs.js
        // nikLerpColor / nikDeviationColor viven ahora en core/utils.js
        // nikCheckProjectNameWatchdog vive ahora en core/init.js
        // nikOpenPlayrateModal / nikClosePlayrateModal / nikPlayrateSliderInput /
        // nikPlayrateSliderCommit / nikPlayrateReset / nikPlayratePreservePitchChange
        // viven ahora en modals/playrate/playrate.js
        // nikReaPitchUpdateSemitoneDisplay / nikReaPitchUpdateEnabledDisplay /

        // nikReaPitchSliderInput / nikReaPitchSliderCommit / nikReaPitchReset /
        // nikReaPitchToggleEnable viven ahora en modals/reapitch/reapitch.js
        // (llamadas desde wwr_onreply más abajo, resueltas en runtime vía window)
        // nikOpenTracksVisModal / nikCloseTracksVisModal / nikTracksVisSetAll /
        // nikApplyTracksVis / nikTracksVisSnapshot viven ahora en
        // modals/tracksvis/tracksvis.js
        // nikMarkerAreaClick / nikOpenMarkerBrowser / nikCloseMarkerBrowser viven
        // ahora en modals/marker-browser/marker-browser.js
        // nikOpenProjectTabsModal / nikCloseProjectTabsModal /
        // nikRenderProjectTabsList viven ahora en
        // modals/project-tabs/project-tabs.js (llamada desde wwr_onreply más abajo,

        // setTextForObject / lumaOffset viven ahora en core/utils.js    
        // mouseDownEventHandler / mouseUpHandler / mouseDownHandler / mouseLeaveHandler /
        // mouseMoveHandler / sendMouseMoveHandler / faderResetToUnity / faderCheckDoubleTap /

        // wwr_onreply() vive ahora en core/wwr-dispatch.js 
        // on_record_button / prompt_abort / prompt_seek / calculateScale / init()
        // viven ahora en core/init.js
