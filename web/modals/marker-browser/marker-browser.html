<div id="nikMarkerBrowserOverlay" onclick="nikCloseMarkerBrowser()"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:flex-start; justify-content:center;">
    <div id="nikMarkerBrowserPanel" onclick="event.stopPropagation()" style="background:#1a1a1a; margin-top:15%; max-height:70vh; width:85%; max-width:400px; border-radius:8px; box-sizing:border-box; position:relative; overflow:hidden;">
        <div id="nikMarkerBrowserScroll" style="max-height:70vh; overflow-y:auto; padding:0 8px 8px 8px; box-sizing:border-box;">
            <div id="nikMarkerBrowserHeader" style="position:sticky; top:0; z-index:1; background:#1a1a1a; border-bottom:2px solid #00D0FF;">
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 8px 6px 8px;">
                    <span
                        style="color:#00D0FF; font-family:'Open Sans',sans-serif; font-size:0.85em; font-weight:bold; letter-spacing:0.05em; text-transform:uppercase;">Markers</span>
                    <span id="nikPreMarkerBarsPill" onclick="nikTogglePreMarkerStepper()"
                        style="color:#EDEDED; font-family:'Open Sans',sans-serif; font-size:1.05em; font-weight:bold; cursor:pointer; padding:5px 14px; background:#262626; border:1px solid #4A8C99; border-radius:12px; user-select:none;">2c</span>
                </div>
                <div id="nikPreMarkerStepperRow"
                    style="display:none; flex-direction:column; align-items:center; gap:4px; padding:2px 8px 14px 8px;">
                    <div style="display:flex; flex-direction:column; align-items:center;">
                        <span id="nikPreMarkerBarsNumber"
                            style="color:#EDEDED; font-family:'Open Sans',sans-serif; font-size:1.8em; font-weight:bold; line-height:1;">2</span>
                        <span id="nikPreMarkerBarsCaption" style="color:#A8A8A8; font-family:'Open Sans',sans-serif; font-size:0.85em; text-transform:uppercase; letter-spacing:0.04em;">compases antes</span>
                    </div>
                    <div style="display:flex; align-items:center; justify-content:center; gap:36px; margin-top:6px;">
                        <div onclick="nikPreMarkerBarsStep(-1)"
                            style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:#262626; border-radius:8px; color:#EDEDED; font-family:'Open Sans',sans-serif; font-size:1.4em; font-weight:bold; user-select:none;">
                            −</div>
                        <div onclick="nikPreMarkerBarsStep(1)"
                            style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:#262626; border-radius:8px; color:#EDEDED; font-family:'Open Sans',sans-serif; font-size:1.4em; font-weight:bold; user-select:none;">
                            +</div>
                    </div>
                </div>
            </div>
        <div id="nikMarkerBrowserList"></div>
        </div>
        <div id="nikMarkerScrollFade"
            style="position:sticky; bottom:0; left:0; right:0; height:28px; margin:0 -8px -8px -8px; background:linear-gradient(to bottom, rgba(26,26,26,0), rgba(26,26,26,0.95)); pointer-events:none; opacity:0; transition:opacity 150ms linear;">
        </div>
    </div>
</div>
