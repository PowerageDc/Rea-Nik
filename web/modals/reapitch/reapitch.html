<div id="nikReaPitchOverlay" onclick="nikCloseReaPitchModal()" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:flex-start; justify-content:center;">
    <div onclick="event.stopPropagation()"
        style="background:#1a1a1a; margin-top:6%; width:85%; max-width:400px; max-height:85vh; overflow-y:auto; border-radius:8px; padding:16px; box-sizing:border-box;">
        <div style="color:#00D0FF; font-family:'Open Sans',sans-serif; font-size:0.85em; font-weight:bold; letter-spacing:0.05em; text-transform:uppercase; padding-bottom:10px; border-bottom:2px solid #00D0FF; margin-bottom:12px;">Semitonos (Stem Bus)</div>
        <div style="display:flex; justify-content:center; margin-bottom:8px;">
            <span id="nikReaPitchValue"
                style="color:#00D0FF; font-family:'Open Sans',sans-serif; font-size:2.2em; font-weight:bold;">0</span>
        </div>
        <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px;">
            <button onclick="nikReaPitchStep(-1);" class="nikVFaderStepBtn">−</button>
            <div class="nikVFaderWrap">
                <input id="nikReaPitchSlider" type="range" min="-12" max="12" value="0" step="1" class="nikVFaderTrack">
            </div>
            <button onclick="nikReaPitchStep(1);" class="nikVFaderStepBtn">+</button>
        </div>
        <div style="display:flex; gap:8px;">
            <button onclick="nikReaPitchReset();" style="flex:1 1 0; background:#262626; color:#A8A8A8; border:none; border-radius:4px; padding:10px 4px; font-family:'Open Sans',sans-serif; font-size:1em;">Reset 0</button>
            <button id="nikReaPitchEnableToggle" onclick="nikReaPitchToggleEnable();" style="flex:1 1 0; background:#262626; color:#A8A8A8; border:none; border-radius:4px; padding:10px 4px; font-family:'Open Sans',sans-serif; font-size:1em;">ReaPitch: —</button>
        </div>
    </div>
</div>
