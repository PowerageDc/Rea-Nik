<div id="nikPlayrateOverlay" onclick="nikClosePlayrateModal()"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:flex-start; justify-content:center;">
    <div onclick="event.stopPropagation()"
        style="background:#1a1a1a; margin-top:6%; width:85%; max-width:400px; max-height:85vh; overflow-y:auto; border-radius:8px; padding:16px; box-sizing:border-box;">
        <div
            style="color:#00D0FF; font-family:'Open Sans',sans-serif; font-size:0.85em; font-weight:bold; letter-spacing:0.05em; text-transform:uppercase; padding-bottom:10px; border-bottom:2px solid #00D0FF; margin-bottom:12px;">
            Playrate</div>
        <div style="display:flex; justify-content:center; align-items:baseline; gap:8px; margin-bottom:4px;">
            <input id="nikPlayrateBpm" type="number" step="0.1" inputmode="decimal" onfocus="this.select()"
                onchange="nikPlayrateBpmCommit(this)" onkeydown="nikPlayrateBpmKeydown(event, this)"
                style="width:130px; text-align:center; background:#262626; color:#00D0FF; border:none; border-radius:4px; padding:10px 4px; font-family:'Open Sans',sans-serif; font-size:2.2em; font-weight:bold;">
            <span
                style="color:#A8A8A8; font-family:'Open Sans',sans-serif; font-size:0.85em; text-transform:uppercase; letter-spacing:0.05em;">BPM</span>
        </div>
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <span id="nikPlayrateValue" style="color:#A8A8A8; font-family:'Open Sans',sans-serif; font-size:1em;">100%</span>
        </div>
        <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px;">
            <button onclick="nikPlayrateStep(-1);" class="nikVFaderStepBtn">−</button>
            <div class="nikVFaderWrap">
                <input id="nikPlayrateSlider" type="range" min="50" max="150" value="100" step="1" class="nikVFaderTrack">
            </div>
            <button onclick="nikPlayrateStep(1);" class="nikVFaderStepBtn">+</button>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:16px;">
            <button onclick="nikPlayrateReset();"
                style="flex:1 1 0; background:#262626; color:#A8A8A8; border:none; border-radius:4px; padding:10px 4px; font-family:'Open Sans',sans-serif; font-size:1em;">Reset
                100%</button>
        </div>
        <label
            style="display:flex; align-items:center; gap:8px; color:#A8A8A8; font-family:'Open Sans',sans-serif; font-size:0.9em;">
            <input id="nikPreservePitchCheckbox" type="checkbox" checked
                onchange="nikPlayratePreservePitchChange(this.checked)">
            Preserve pitch al cambiar playrate
        </label>
    </div>
</div>
